<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yasal metinler · Lumistack</title><link rel="icon" href="ikon.png"><style>
:root{--mavi:#1d4ed8;--yazi:#22305c;--soluk:#55617a;--zemin:#eef4fb;--kart:#ffffff;--kenar:#c9d4e2}
@media (prefers-color-scheme: dark){:root{--yazi:#e6ecf5;--soluk:#a9b6c9;--zemin:#0f1730;--kart:#18223f;--kenar:#2c3a5e;--mavi:#7aa7ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--zemin);color:var(--yazi);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(180deg,#3d8fe0,#7cc0f5);color:#fff;padding:28px 16px;text-align:center}
header img{width:84px;height:84px;border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
header h1{margin:10px 0 0;font-size:26px}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px 16px}
nav a{background:var(--kart);border:1px solid var(--kenar);border-radius:999px;padding:6px 14px;color:var(--mavi);text-decoration:none;font-weight:600}
main{max-width:820px;margin:0 auto 40px;padding:0 16px}
article{background:var(--kart);border:1px solid var(--kenar);border-radius:18px;padding:8px 24px 24px}
h1,h2,h3{line-height:1.25} a{color:var(--mavi)} code{background:rgba(127,127,127,.15);padding:1px 5px;border-radius:5px}
table{border-collapse:collapse;width:100%;display:block;overflow-x:auto} td,th{border:1px solid var(--kenar);padding:6px 8px;text-align:left}
.yer{background:#fff3c4;color:#7a4b00;padding:0 4px;border-radius:4px}
footer{text-align:center;color:var(--soluk);font-size:14px;padding:20px}
